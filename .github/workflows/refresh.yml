name: Refresh Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # once daily, 6am UTC
  workflow_dispatch:        # adds a manual "Run workflow" button in GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh data from Breww
        env:
          BREWW_API_KEY: ${{ secrets.BREWW_API_KEY }}
        run: python fetch_data.py

      - name: Build the dashboard
        run: python build_dashboard.py

      - name: Rename to index.html
        run: mv dashboard.html index.html

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (preview - NOT production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(vercel deploy --token=$VERCEL_TOKEN --yes)
          echo "Deployed to: $DEPLOY_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Point the stable alias at this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel alias set ${{ steps.deploy.outputs.deploy_url }} dashboard-abco-live.vercel.app --token=$VERCEL_TOKEN

      - name: SECURITY CHECK - verify the dashboard is NOT publicly accessible
        run: |
          RESPONSE=$(curl -s -L "https://dashboard-abco-live.vercel.app")
          if echo "$RESPONSE" | grep -q "ABCo Breww Dashboard"; then
            echo "::error::SECURITY ALERT - the dashboard loaded WITHOUT logging in. It is currently publicly exposed. Do not ignore this - go check Vercel Deployment Protection settings immediately."
            exit 1
          fi
          echo "Verified: dashboard is NOT accessible without logging in."
