name: Refresh Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # once daily, 6am UTC
  workflow_dispatch:        # adds a manual "Run workflow" button in GitHub

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch fresh data from Breww
        env:
          BREWW_API_KEY: ${{ secrets.BREWW_API_KEY }}
        run: python fetch_data.py

      - name: Build the dashboard
        run: python build_dashboard.py

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --token=$VERCEL_TOKEN --yes
